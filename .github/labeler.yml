# Which area/* label a pull request gets, from the files it touches.
#
# Applied by .github/workflows/labeler.yml with actions/labeler@v5. `sync-labels`
# is off there, so this only ever adds labels: one applied by hand is never
# taken away, and a label that stops matching stays until somebody removes it.
#
# The names here have to exist on the repository. They are maintained outside
# it, with the label list and the script that applies it.

"area/msys2":
  - changed-files:
      - any-glob-to-any-file:
          - "src/core/msys2.rs"
          - "src/core/versions.rs"
          - "src/infra/msys2/**"
          - "src/app/provision.rs"

"area/pacman":
