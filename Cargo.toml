[package]
name = "proxspace"
version = "3.12.0"
edition = "2024"
rust-version = "1.85"
description = "Proxmark3 development environment for Windows: a single binary that provisions and runs an msys2/UCRT64 toolchain"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
ctrlc = "3.5.2"
dialoguer = { version = "0.12.0", default-features = false }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = [
    "system",
] }
tar = "0.4.46"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
xz2 = "0.1.7"

[target.'cfg(windows)'.build-dependencies]
# Icon, version resource and manifest for the executable (see build.rs).
winresource = "0.1.31"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tar = "0.4.46"
tempfile = "3.27.0"
xz2 = "0.1.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
