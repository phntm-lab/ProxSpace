[package]
name = "proxspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Proxmark3 development environment for Windows: a single binary that provisions and runs an msys2/UCRT64 toolchain"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
ctrlc = "3"
dialoguer = { version = "0.11", default-features = false }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
