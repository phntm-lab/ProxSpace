[package]
name = "proxspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Proxmark3 development environment for Windows: a single binary that provisions and runs an msys2/UCRT64 toolchain"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
ctrlc = "3.5.2"
dialoguer = { version = "0.12.0", default-features = false }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
